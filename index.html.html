<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 마음 명언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>

  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){

}
:root[data-theme="dark"]{
  --bg:#151b1e; --ink:#e6ecec; --sub:#a3b0b3; --card:#1e2629; --line:#34403f;
  --joy-t:#3a3720; --joy-a:#e3d589;
  --sad-t:#1f3040; --sad-a:#9cc3e3;

}

.btn[data-k="ang"],.card[data-k="ang"]{background:var(--ang-t);--a:var(--ang-a)}
.tr{margin:16px 0 0;font-size:1.3rem;line-height:1.6;color:var(--sub);word-break:keep-all}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;transition:background .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(1.6rem,5vw,2.1rem);margin:8px 0 6px;font-weight:700;line-height:1.35}
.lead{margin:0 0 22px;color:var(--sub);font-size:1.15rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{font:700 clamp(1.2rem,4.4vw,1.55rem)/1.35 "Noto Sans KR",sans-serif;min-height:100px;padding:18px 14px;border-radius:22px;border:3px solid transparent;cursor:pointer;color:var(--ink);transition:border-color .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.more:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn[data-k="joy"]{background:var(--joy-t)}
.btn[data-k="sad"]{background:var(--sad-t)}
.btn[data-k="tir"]{background:var(--tir-t)}
.btn[data-k="anx"]{background:var(--anx-t)}
.btn[aria-pressed="true"]{border-color:var(--a)}
.btn[data-k="joy"]{--a:var(--joy-a)} .btn[data-k="sad"]{--a:var(--sad-a)}
.btn[data-k="tir"]{--a:var(--tir-a)} .btn[data-k="anx"]{--a:var(--anx-a)}
.card{margin-top:26px;padding:38px 26px 30px;border-radius:26px;background:var(--card);border:1px solid var(--line);min-height:300px;display:flex;flex-direction:column;justify-content:center}

.card[data-k="sad"]{background:var(--sad-t);--a:var(--sad-a)}
.card[data-k="tir"]{background:var(--tir-t);--a:var(--tir-a)}
.card[data-k="anx"]{background:var(--anx-t);--a:var(--anx-a)}

.who{margin:20px 0 0;font-size:1.2rem;color:var(--a,var(--sub));font-weight:500}
.fade{animation:in .55s ease both}

.more{margin-top:22px;width:100%;min-height:76px;font:700 1.35rem "Noto Sans KR",sans-serif;border-radius:20px;border:3px solid var(--a);background:transparent;color:var(--a);cursor:pointer}
.more[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn,body{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>오늘 마음은 어떤가요?</h1>
  <p class="lead">지금 느끼는 감정을 하나 골라 보세요.</p>
  <div class="btns" id="btns">
    <button class="btn" data-k="joy" aria-pressed="false">기쁘고 행복함</button>
    <button class="btn" data-k="sad" aria-pressed="false">슬프고 우울함</button>
    <button class="btn" data-k="tir" aria-pressed="false">지치고 번아웃</button>
    <button class="btn" data-k="anx" aria-pressed="false">불안하고 스트레스</button>
    <button class="btn" data-k="exc" aria-pressed="false">설레고 두근거림</button>
    <button class="btn" data-k="emp" aria-pressed="false">아무 생각 없음</button>
    <button class="btn" data-k="lon" aria-pressed="false">외롭고 쓸쓸함</button>
    <button class="btn" data-k="ang" aria-pressed="false">화나고 답답함</button>
  </div>
  <section class="card" id="card" aria-live="polite">
    <p class="q hint" id="q">감정을 고르면 그 마음에 맞는 명언이 나타나요.</p>
    <p class="tr" id="tr"></p>
    <p class="who" id="who"></p>
  </section>
  <button class="more" id="more" hidden>다른 명언 보기</button>
</main>

const bag={},last={};
function next(k){
  if(!bag[k]||!bag[k].length){
    const a=D[k].map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    if(a[a.length-1]===last[k])a.unshift(a.pop());
    bag[k]=a;
  }
  last[k]=bag[k].pop();
  return D[k][last[k]].split("|");
}
const card=document.getElementById("card"),q=document.getElementById("q"),who=document.getElementById("who"),tr=document.getElementById("tr"),more=document.getElementById("more");
let cur=null;
function show(k){
  cur=k;
  const [t,a,x]=next(k);
  card.dataset.k=k; more.dataset.k=k; more.style.setProperty("--a",getComputedStyle(card).getPropertyValue("--a"));
  q.className="q fade"; q.textContent="“"+t+"”";
  tr.className="tr fade"; tr.textContent=x||"";
  who.className="who fade"; who.textContent=a?"— "+a:"";
  more.hidden=false;
  document.querySelectorAll(".btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
}
document.getElementById("btns").addEventListener("click",e=>{const b=e.target.closest(".btn");if(b)show(b.dataset.k)});
more.addEventListener("click",()=>cur&&show(cur));
